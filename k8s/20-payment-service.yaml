apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: order-platform
  labels: { app: payment-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: payment-service
          image: ghcr.io/rajkumar2119/payment-service:latest   # CI pushes ghcr.io/<owner>/payment-service:<git-sha>
          ports:
            - containerPort: 8082
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: order-platform-config, key: KAFKA_BOOTSTRAP_SERVERS } }
            - name: DB_URL
              valueFrom: { configMapKeyRef: { name: order-platform-config, key: PAYMENTS_DB_URL } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: order-platform-secrets, key: PAYMENTS_DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: order-platform-secrets, key: PAYMENTS_DB_PASSWORD } }

          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: order-platform
spec:
  selector: { app: payment-service }
  ports:
    - port: 80
      targetPort: 8082
