apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: order-platform
  labels: { app: order-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: order-service
          image: ghcr.io/rajkumar2119/order-service:latest   # CI pushes ghcr.io/<owner>/order-service:<git-sha>
          ports:
            - containerPort: 8081
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: order-platform-config, key: KAFKA_BOOTSTRAP_SERVERS } }
            - name: DB_URL
              valueFrom: { configMapKeyRef: { name: order-platform-config, key: ORDERS_DB_URL } }
            - name: DB_USERNAME
              valueFrom: { secretKeyRef: { name: order-platform-secrets, key: ORDERS_DB_USERNAME } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: order-platform-secrets, key: ORDERS_DB_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: order-platform-secrets, key: JWT_SECRET } }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: order-platform
spec:
  selector: { app: order-service }
  ports:
    - port: 80
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: order-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
