spring:
  datasource:
    url: jdbc:h2:mem:payments;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

logging:
  level:
    org.apache.kafka: WARN
    kafka: WARN
    # Shows dead-letter publishing in the test output, so a DLT test failure is easy to diagnose.
    org.springframework.kafka.listener.DeadLetterPublishingRecoverer: DEBUG
    org.springframework.kafka.listener.DefaultErrorHandler: DEBUG
